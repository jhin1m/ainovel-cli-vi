<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thư viện truyện</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6E62}a:hover{color:#0A5249}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F3; color: #15171A; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2.5Z"></path><path d="M8 7h6"></path><path d="M8 11h4"></path></svg>
      <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em">AI Novel</span>
    </div>
    <a href="Keys.dc.html" aria-label="Cài đặt tài khoản" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E4E7; display: flex; align-items: center; justify-content: center; color: #15171A; text-decoration: none; font-size: 14px; font-weight: 600">ĐA</a>
  </header>

  <section style="padding: 12px 20px 4px">
    <h1 style="margin: 0; font-family: 'Literata', Georgia, serif; font-size: 32px; font-weight: 600; letter-spacing: -0.01em">Thư viện</h1>
    <p style="margin: 6px 0 0; font-size: 14px; color: #5A606A">4 truyện · 1 đang viết · 1 chờ bạn duyệt</p>
  </section>

  <nav aria-label="Lọc truyện" style="display: flex; gap: 8px; padding: 14px 20px 6px; overflow-x: auto">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
      <button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
    </sc-for>
  </nav>

  <main style="flex: 1; overflow: hidden; padding: 10px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{books}}" as="b" hint-placeholder-count="4">
      <a href="{{b.href}}" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #FFFFFF; border: 1px solid #E2E4E7; border-radius: 14px; text-decoration: none; color: #15171A">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-family: 'Literata', Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.3">{{b.title}}</span>
            <span style="font-size: 13px; color: #5A606A">{{b.genre}}</span>
          </div>
          <span style="{{b.badgeStyle}}">
            <sc-if value="{{b.live}}" hint-placeholder-val="{{false}}">
              <span style="width: 7px; height: 7px; border-radius: 4px; background: currentColor; animation: pulse 1.4s ease-in-out infinite"></span>
            </sc-if>
            {{b.status}}
          </span>
        </div>
        <div style="height: 6px; border-radius: 3px; background: #ECEEF0; overflow: hidden">
          <div style="height: 6px; border-radius: 3px; background: {{b.barColor}}; width: {{b.pct}}%"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #5A606A">
          <span>{{b.progress}}</span>
          <span>{{b.meta}}</span>
        </div>
        <sc-if value="{{b.hasNote}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 13px; font-weight: 500; color: {{b.noteColor}}">{{b.note}}</span>
        </sc-if>
      </a>
    </sc-for>
  </main>

  <nav aria-label="Điều hướng chính" style="display: flex; align-items: center; justify-content: space-around; gap: 8px; padding: 10px 16px 22px; background: #FFFFFF; border-top: 1px solid #E2E4E7">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 44px; justify-content: center; text-decoration: none; color: #15171A; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2.5Z"></path></svg>
      Thư viện
    </a>
    <a href="NewBook.dc.html" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 24px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
      Truyện mới
    </a>
    <a href="Keys.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 44px; justify-content: center; text-decoration: none; color: #5A606A; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg>
      Cài đặt
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6E62","options":["#0E6E62","#3346A8","#8A3B12","#15171A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6E62';
    const tone = {
      running: { fg: accent, bg: '#E2F0EC', bar: accent },
      review: { fg: '#3346A8', bg: '#E7EAF8', bar: '#3346A8' },
      budget: { fg: '#8A4B08', bg: '#FBEFDF', bar: '#B86A16' },
      done: { fg: '#15171A', bg: '#ECEEF0', bar: '#15171A' }
    };
    const all = [
      { key: 'running', href: 'BookLive.dc.html', title: 'Kiếm Đạo Độc Tôn', genre: 'Tu tiên · bắt đầu 11/10', status: 'Đang viết', live: true, pct: 22, progress: 'Chương 13/60', meta: '38.214 chữ · 1,82 / 5 US$', hasNote: false, note: '' },
      { key: 'review', href: 'ReviewWait.dc.html', title: 'Hà Nội, Mùa Mưa Cuối', genre: 'Ngôn tình · đô thị', status: 'Chờ duyệt', live: false, pct: 25, progress: 'Chương 6/24', meta: '24.730 chữ · 0,94 / 5 US$', hasNote: true, note: 'Chương 6 đã xong — đang chờ bạn cho viết tiếp', noteColor: '#3346A8' },
      { key: 'budget', href: 'StatusBanners.dc.html', title: 'Thám Tử Phố Cổ', genre: 'Trinh thám', status: 'Hết ngân sách', live: false, pct: 55, progress: 'Chương 22/40', meta: '71.508 chữ · 10,00 / 10 US$', hasNote: true, note: 'Tăng ngân sách để viết tiếp', noteColor: '#8A4B08' },
      { key: 'done', href: 'Reader.dc.html', title: 'Linh Khí Phục Hồi', genre: 'Đô thị dị năng · hoàn thành 02/10', status: 'Hoàn thành', live: false, pct: 100, progress: '120/120 chương', meta: '412.880 chữ · 18,40 US$', hasNote: false, note: '' }
    ];
    const books = all
      .filter((b) => this.state.filter === 'all' || this.state.filter === b.key)
      .map((b) => {
        const t = tone[b.key];
        return {
          ...b,
          barColor: t.bar,
          badgeStyle: 'display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: ' + t.fg + '; background: ' + t.bg
        };
      });
    const chipDefs = [
      { id: 'all', label: 'Tất cả' },
      { id: 'running', label: 'Đang viết' },
      { id: 'review', label: 'Chờ duyệt' },
      { id: 'done', label: 'Hoàn thành' }
    ];
    const chips = chipDefs.map((c) => {
      const on = this.state.filter === c.id;
      return {
        label: c.label,
        pick: () => this.setState({ filter: c.id }),
        style: 'flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; ' +
          (on ? 'background: #15171A; color: #FFFFFF; border: 1px solid #15171A' : 'background: #FFFFFF; color: #15171A; border: 1px solid #E2E4E7')
      };
    });
    return { accent, books, chips };
  }
}
</script>
</body>
</html>
